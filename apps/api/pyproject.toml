[project]
name = "grok-bot-api"
version = "0.1.0"
description = "Grok Bot M0 foundation API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.20.1",
  "cryptography==50.0.2",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "pillow==13.0.0",
  "psycopg[binary]==3.3.8",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "sqlalchemy==2.1.8",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
