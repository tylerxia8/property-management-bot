# Docker Compose 2.24.4+; layer over compose.demo.yaml on a dedicated demo server.
services:
  web:
    ports: !reset []

  proxy:
    image: caddy:2.10.2-alpine
    depends_on:
      web:
        condition: service_healthy
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:?Set the demo hostname}
      DEMO_USER: ${DEMO_USER:?Set the demo username}
      DEMO_PASSWORD_HASH: ${DEMO_PASSWORD_HASH:?Set a bcrypt password hash}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/hosted-demo/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [sample]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
