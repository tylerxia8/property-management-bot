# Local evidence suite. No deployment, payment provider, or repository secret.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install PostgreSQL and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib ffmpeg
          sudo systemctl enable --now postgresql
          pg_isready -h 127.0.0.1
          # psql runs as the postgres user and opens SQL files by path.
          # The runner home directory is not traversable by that user.
          sudo chmod a+rx /home/runner /home/runner/work /home/runner/work/property-management-bot "$GITHUB_WORKSPACE"
          sudo chmod -R a+rX "$GITHUB_WORKSPACE"

      - name: Install locked Python packages
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/pip install -r apps/api/requirements.lock
          apps/api/.venv/bin/pip install --no-deps --no-build-isolation -e apps/api
          apps/api/.venv/bin/pip check

      - name: Run pytest, web build, typecheck, and Playwright
        run: bash scripts/run_m0_evidence.sh
